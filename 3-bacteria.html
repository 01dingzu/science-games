<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>细菌帝国 · 肠道争霸</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body { background:#1a1226; color:#efe6f7; font-family:"Microsoft YaHei",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:14px; }
  h1 { font-size:21px; margin-bottom:2px; }
  .sub { color:#a897c2; font-size:13px; margin-bottom:8px; text-align:center; }
  #hud { display:flex; gap:14px; font-size:13px; flex-wrap:wrap; justify-content:center; margin-bottom:8px; }
  #hud b { color:#7ef0c2; }
  #hud .dim { color:#a897c2; }
  canvas { border-radius:12px; cursor:pointer; touch-action:manipulation; }
  #btns { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
  button { background:#6a3fa0; color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.enemy { background:#b8442f; }
  #log { min-height:44px; margin-top:8px; font-size:13px; color:#c9b8de; max-width:480px; text-align:center; line-height:1.6; }
  #stars { font-size:20px; color:#ffb454; letter-spacing:3px; min-height:24px; }
  #curve { display:flex; gap:4px; margin-top:8px; align-items:flex-end; height:26px; }
  #curve i { display:block; width:26px; background:#3a2b52; border-radius:2px 2px 0 0; }
  #curve i.done { background:#3f8f74; }
  #curve i.cur { background:#ffb454; }
  .tip { color:#a897c2; font-size:12px; margin-top:8px; max-width:480px; text-align:center; line-height:1.7; }
</style>
<script src="hub.js"></script>
</head>
<body>
<h1>🦠 细菌帝国</h1>
<div class="sub">四段肠道，四张地形：越往深处致病菌越多、免疫巡逻越勤</div>
<div id="hud">
  <span>第 <b id="lv">1</b>/4 关 · <span class="dim" id="lvname"></span></span>
  <span>⚡ 能量 <b id="energy">5</b></span>
  <span>🟢 益生 <b id="pc">0</b>%</span>
  <span>🔴 致病 <b id="ec">0</b>%</span>
  <span>🛡 免疫 <b id="imm">0</b>%</span>
  <span>回合 <b id="turn">1</b>/<b id="tmax">15</b></span>
</div>
<canvas id="cv" width="432" height="432"></canvas>
<div id="btns">
  <button onclick="colonize()">🌱 定殖（1⚡）</button>
  <button class="enemy" onclick="fight()">⚔️ 抑菌（2⚡）</button>
  <button onclick="endTurn()">⏭ 下一回合</button>
  <button onclick="restart(level)">🔄 重玩本关</button>
</div>
<div id="log"></div>
<div id="stars"></div>
<div id="curve"></div>
<div class="tip">金黄色格子是营养区：把菌群铺过去，每占一格能量 +1。<br>免疫警戒越高，免疫细胞越容易盯上你——扩张太猛反而会被清场。</div>
<script>
"use strict";
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
// 0 空 | 1 益生 | 2 致病 | 3 免疫 | 4 营养区
// 难度曲线：教学(8×8) → 营养区(10×10) → 免疫高压(12×12) → 终局(12×12 满敌)
const LEVELS = [
  { name:'十二指肠 · 教学', N:8, goal:0.40, grow:2, immuneEvery:4, limit:15, rows:[
    '00000000','00000000','00110000','00000022',
    '00000022','00000000','00000000','00000000'] },

  { name:'空肠 · 营养区', N:10, goal:0.42, grow:2, immuneEvery:3, limit:18, rows:[
    '0000000000','0011400000','0000000000','0000000220',
    '0000000220','0000004000','0000000000','0000000000',
    '0000400000','0000000000'] },

  { name:'回肠 · 免疫高压', N:12, goal:0.45, grow:3, immuneEvery:2, limit:20, rows:[
    '000000000000','001100000000','001100000222','000000000222',
    '000000000222','000000000000','000000000000','000000000000',
    '000000000000','000000000000','000000000000','000000000000'] },

  { name:'结肠 · 终局', N:12, goal:0.50, grow:3, immuneEvery:2, limit:22, rows:[
    '000000000000','001100002222','001100002222','000000002222',
    '000000400000','000000000000','000040000000','000000000000',
    '000000000400','000000000000','000000000000','000000000000'] },
];
const DIFF = [1,2,3,4];
let grid, energy, turn, mode, immune, logMsg, over, level, N, CELL;
function restart(lv){
  level = Math.max(0, Math.min(LEVELS.length-1, lv === undefined ? 0 : lv));
  const L = LEVELS[level];
  N = L.N; CELL = Math.floor(432 / N);
  grid = L.rows.map(r => r.split('').map(Number));
  energy = 5; turn = 1; mode = null; immune = 0; over = false;
  logMsg = '第 ' + (level+1) + ' 关 · ' + L.name + '：目标占领 ' + Math.round(L.goal*100) + '% 肠道。';
  document.getElementById('lv').textContent = level+1;
  document.getElementById('lvname').textContent = L.name.split(' · ')[0];
  document.getElementById('tmax').textContent = L.limit;
  document.getElementById('stars').textContent = '';
  renderCurve();
  document.getElementById('log').textContent = logMsg;
  draw(); updateHud();
}
function renderCurve(){
  const el = document.getElementById('curve');
  el.innerHTML = '';
  DIFF.forEach((d, i) => {
    const b = document.createElement('i');
    b.style.height = (6 + d*5) + 'px';
    if (i < level) b.className = 'done'; else if (i === level) b.className = 'cur';
    b.title = '第 ' + (i+1) + ' 关';
    el.appendChild(b);
  });
}
function updateHud(){
  let p = 0, e = 0;
  for (const row of grid) for (const c of row){ if (c===1) p++; if (c===2) e++; }
  const tot = N*N;
  document.getElementById('energy').textContent = energy;
  document.getElementById('pc').textContent = Math.round(p/tot*100);
  document.getElementById('ec').textContent = Math.round(e/tot*100);
  document.getElementById('imm').textContent = immune;
  document.getElementById('turn').textContent = turn;
  return {p, e, tot};
}
function isEmpty(x, y){ const c = grid[y][x]; return c === 0 || c === 4; }
cv.addEventListener('click', ev => {
  if (over) return;
  const r = cv.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left) / (r.width / N));
  const y = Math.floor((ev.clientY - r.top) / (r.height / N));
  if (x < 0 || y < 0 || x >= N || y >= N) return;
  if (mode === 'colonize'){
    if (!isEmpty(x, y)){ setLog('那里已经有住户了，选个空格。'); return; }
    if (!hasNeighbor(x, y, 1)){ setLog('定殖必须贴着已有的益生菌（扩散距离有限）。'); return; }
    if (energy < 1){ setLog('能量不足！等下一回合。'); return; }
    energy--;
    if (grid[y][x] === 4){ energy++; setLog('🍯 占领营养区！能量不减反增，菌群 +1'); }
    else setLog('定殖成功！菌群 +1');
    grid[y][x] = 1;
  } else if (mode === 'fight'){
    if (grid[y][x] !== 2){ setLog('要点击红色致病菌才能抑菌。'); return; }
    if (!hasNeighbor(x, y, 1)){ setLog('只能抑菌与益生菌接壤的敌人。'); return; }
    if (energy < 2){ setLog('能量不足（需要 2⚡）。'); return; }
    energy -= 2; grid[y][x] = 0;
    setLog('💪 分泌细菌素，致病菌被清除！');
  } else {
    setLog('先点上面的「定殖」或「抑菌」，再点棋盘。');
  }
  draw(); updateHud();
});
function hasNeighbor(x, y, type){
  return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => {
    const nx = x+dx, ny = y+dy;
    return nx>=0 && ny>=0 && nx<N && ny<N && grid[ny][nx] === type;
  });
}
function setLog(s){ logMsg = s; document.getElementById('log').textContent = s; }
function endTurn(){
  if (over) return;
  const L = LEVELS[level];
  mode = null; turn++;
  spread(1, L.grow);
  spread(2, 2);
  if (turn % L.immuneEvery === 0){
    const target = immune >= 40 ? 1 : (Math.random() < 0.5 ? 1 : 2);
    const cells = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (grid[y][x] === target) cells.push([x,y]);
    if (cells.length){
      const [cx, cy] = cells[Math.floor(Math.random()*cells.length)];
      grid[cy][cx] = 3;
      if (target === 1) immune += 6;
      setLog('🛡 免疫细胞出动，吞噬了一片菌群！扩张越猛，免疫警戒越高。');
    }
  } else {
    immune = Math.max(0, immune - 2);
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (grid[y][x] === 3 && Math.random() < 0.5) grid[y][x] = 0;
  energy = Math.min(8, energy + 2);
  const {p, tot} = updateHud();
  draw();
  const L2 = LEVELS[level];
  if (p / tot >= L2.goal){
    over = true;
    const ratio = 1 - (turn / L2.limit);
    const stars = ratio >= 0.4 ? '★★★ 迅雷之势！' : ratio >= 0.2 ? '★★☆ 稳扎稳打' : '★☆☆ 险胜';
    document.getElementById('stars').textContent = stars;
    setLog('🏆 这一段肠道拿下了！用了 ' + turn + ' 回合。');
    if (level === LEVELS.length - 1){
      hub.finish({ win:true, title:'🏆 整条肠道都是你的！',
        text:'从十二指肠到结肠，你学会了真正的胜负手：不是扩张速度，而是压住免疫警戒、抢下营养区。',
        stat:'4 关全通 · ' + stars });
    } else {
      setTimeout(() => restart(level+1), 1400);
    }
  } else if (p === 0){
    over = true;
    setLog('💀 全军覆没……致病菌占领了肠道，宿主开始腹泻。');
    hub.finish({ win:false, title:'💀 全军覆没',
      text:'致病菌占领了肠道。下次别一味猛扩——先用抑菌清出空间，免疫警戒才是隐形天花板。',
      stat:'第 ' + (level+1) + ' 关 · 撑了 ' + turn + ' 回合' });
  } else if (turn > L2.limit){
    over = true;
    setLog('⏰ 时限到了，菌群没能铺满这一段肠道。');
    hub.finish({ win:false, title:'⏰ 时间到',
      text:'扩张太保守了。诀窍：优先占领营养区（能量不减反增），再用能量连续定殖，别一回合只点一下。',
      stat:'第 ' + (level+1) + ' 关 · 占领 ' + Math.round(p/tot*100) + '% / 需要 ' + Math.round(L2.goal*100) + '%' });
  }
}
function spread(type, times){
  for (let t = 0; t < times; t++){
    const cells = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
      if (grid[y][x] === type && hasNeighborEmpty(x, y)) cells.push([x,y]);
    }
    if (!cells.length) break;
    const [x, y] = cells[Math.floor(Math.random()*cells.length)];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy]) => {
      const nx = x+dx, ny = y+dy;
      return nx>=0 && ny>=0 && nx<N && ny<N && isEmpty(nx, ny);
    });
    if (dirs.length){
      const [dx, dy] = dirs[Math.floor(Math.random()*dirs.length)];
      if (grid[y+dy][x+dx] === 4 && type === 1) energy = Math.min(8, energy + 1);
      grid[y+dy][x+dx] = type;
    }
  }
}
function hasNeighborEmpty(x, y){
  return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => {
    const nx = x+dx, ny = y+dy;
    return nx>=0 && ny>=0 && nx<N && ny<N && isEmpty(nx, ny);
  });
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#241a38'; ctx.fillRect(0,0,cv.width,cv.height);
  for (let y = 0; y < N; y++){
    for (let x = 0; x < N; x++){
      const c = grid[y][x];
      const px = x*CELL, py = y*CELL;
      let col = '#241a38';
      if (c === 1) col = '#2f9e6e';
      if (c === 2) col = '#c04a35';
      if (c === 3) col = '#e8e2f0';
      if (c === 4) col = '#8a6d2f';
      ctx.fillStyle = col;
      ctx.fillRect(px+1, py+1, CELL-2, CELL-2);
      if (c){
        ctx.font = Math.max(12, CELL-14) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(c===1?'🦠':c===2?'💀':c===3?'🛡':'🍯', px+CELL/2, py+CELL/2+1);
      }
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  for (let i = 0; i <= N; i++){
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, N*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(N*CELL, i*CELL); ctx.stroke();
  }
}
function colonize(){ mode = mode === 'colonize' ? null : 'colonize'; setLog(mode ? '🌱 定殖模式：点击与益生菌相邻的空格（营养区更划算）。' : '取消模式。'); }
function fight(){ mode = mode === 'fight' ? null : 'fight'; setLog(mode ? '⚔️ 抑菌模式：点击与益生菌相邻的红色致病菌。' : '取消模式。'); }
restart(0);
</script>
</body>
</html>
