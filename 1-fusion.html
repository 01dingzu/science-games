<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素炼金塔 · 恒星核聚变</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0e1a; color:#e8ecf5; font-family:"Microsoft YaHei",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:16px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#8fa3c8; font-size:13px; margin-bottom:8px; text-align:center; }
  #hud { display:flex; gap:18px; font-size:14px; margin-bottom:8px; flex-wrap:wrap; justify-content:center; }
  #hud b { color:#ffd166; }
  #hud .dim { color:#9db2d0; }
  canvas { background:radial-gradient(ellipse at 50% 20%, #1a2140 0%, #0b0e1a 70%); border-radius:12px; cursor:crosshair; touch-action:none; }
  .tip { color:#8fa3c8; font-size:12px; margin-top:8px; max-width:430px; text-align:center; line-height:1.7; }
  #stars { font-size:20px; color:#ffb454; letter-spacing:3px; min-height:24px; margin-top:4px; }
  #curve { display:flex; gap:4px; margin-top:8px; align-items:flex-end; height:26px; }
  #curve i { display:block; width:20px; background:#1e2942; border-radius:2px 2px 0 0; }
  #curve i.done { background:#3f8f74; }
  #curve i.cur { background:#ffd166; }
  button { background:#2a3468; color:#fff; border:none; padding:8px 18px; border-radius:8px; font-size:14px; cursor:pointer; margin-top:8px; }
</style>
<script src="hub.js"></script>
<script src="stories.js"></script>
</head>
<body>
<h1>☀️ 元素炼金塔</h1>
<div class="sub">每关一个目标元素：在发射次数用完之前，把它聚变出来</div>
<div id="hud">
  <span>第 <b id="lv">1</b>/6 关 · <span class="dim" id="lvname"></span></span>
  <span>目标 <b id="goal">氦 He</b></span>
  <span>剩余发射 <b id="shots">10</b></span>
</div>
<canvas id="cv" width="420" height="600"></canvas>
<div id="stars"></div>
<div id="curve"></div>
<button onclick="restart(level)">🔁 重玩本关</button>
<div class="tip">同种元素相撞 → 聚变成更重的元素：氢→氦→碳→氧→硅→铁。<br>灰色 ✕ 是氦灰（聚变废渣，占地方但不反应）。原子堆过顶部警戒线 = 恒星坍缩。</div>
<script>
"use strict";
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 420, H = 600, DANGER = 110;
const ELS = [
  {n:'氢', s:'H',  r:16, c:'#7ee8fa', next:1},
  {n:'氦', s:'He', r:22, c:'#9d8df1', next:2},
  {n:'碳', s:'C',  r:29, c:'#6ee7a0', next:3},
  {n:'氧', s:'O',  r:37, c:'#ff8fa3', next:4},
  {n:'硅', s:'Si', r:46, c:'#ffb454', next:5},
  {n:'铁', s:'Fe', r:56, c:'#e8ecf5', next:null},
  {n:'氦灰', s:'✕', r:20, c:'#5a5f6a', next:null, ash:true},
];
const ASH = 6;
// 难度曲线：教学 → 练习 → 新机制(氦灰) → 峰值 → 喘息 → 终局
const LEVELS = [
  { name:'点火',       goal:1, shots:10, pool:[0],       ash:0, hint:'两个氢撞在一起 → 氦。随便打，很宽松' },
  { name:'氦燃烧',     goal:2, shots:14, pool:[0,1],     ash:0, hint:'氦 + 氦 = 碳。先攒氢，再合氦' },
  { name:'挤一挤',     goal:2, shots:12, pool:[0,1],     ash:3, hint:'新机制：灰色氦灰不参与聚变，还会占地方' },
  { name:'灰越来越多', goal:3, shots:16, pool:[1,2],     ash:4, hint:'碳 + 碳 = 氧。空间紧张，先清出一块空地' },
  { name:'喘息关',     goal:3, shots:20, pool:[1,1,2,2], ash:0, hint:'这一关很宽松，痛快地堆一次' },
  { name:'铁的终点',   goal:5, shots:26, pool:[2,3,3,4], ash:2, hint:'终局：一路炼到铁，触发超新星' },
];
const DIFF = [1,2,3,4,1,5];
let balls, score, nextTier, aimX, over, shake, flash, mergeLock, feDone;
let level, shots, cleared;
function restart(lv){
  level = Math.max(0, Math.min(LEVELS.length-1, lv === undefined ? 0 : lv));
  const L = LEVELS[level];
  balls = []; score = 0; over = false; shake = 0; flash = 0; mergeLock = new Set();
  feDone = false; cleared = false;
  shots = L.shots;
  for (let i = 0; i < L.ash; i++){
    balls.push({x: 60 + Math.random()*(W-120), y: H - 40 - Math.random()*60, vx:0, vy:0, tier:ASH});
  }
  nextTier = L.pool[Math.floor(Math.random()*L.pool.length)];
  document.getElementById('lv').textContent = level+1;
  document.getElementById('lvname').textContent = L.name;
  document.getElementById('goal').textContent = ELS[L.goal].n + ' ' + ELS[L.goal].s;
  document.getElementById('stars').textContent = '';
  renderCurve(); updateHud();
}
function renderCurve(){
  const el = document.getElementById('curve');
  el.innerHTML = '';
  DIFF.forEach((d, i) => {
    const b = document.createElement('i');
    b.style.height = (6 + d*4) + 'px';
    if (i < level) b.className = 'done'; else if (i === level) b.className = 'cur';
    b.title = '第 ' + (i+1) + ' 关';
    el.appendChild(b);
  });
}
function updateHud(){
  document.getElementById('shots').textContent = shots;
}
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  aimX = (e.clientX - r.left) * (W / r.width);
});
cv.addEventListener('touchmove', e => {
  const r = cv.getBoundingClientRect();
  aimX = (e.touches[0].clientX - r.left) * (W / r.width);
  e.preventDefault();
}, {passive:false});
let cooldown = 0;
cv.addEventListener('mousedown', fire);
cv.addEventListener('touchstart', e => {
  const r = cv.getBoundingClientRect();
  aimX = (e.touches[0].clientX - r.left) * (W / r.width);
  fire(); e.preventDefault();
}, {passive:false});
function fire(){
  if (over || cooldown > 0 || shots <= 0) return;
  const t = nextTier, e = ELS[t];
  balls.push({x: Math.max(e.r, Math.min(W - e.r, aimX || W/2)), y: DANGER + e.r, vx: 0, vy: 1, tier: t});
  shots--;
  const pool = LEVELS[level].pool;
  nextTier = pool[Math.floor(Math.random()*pool.length)];
  cooldown = 25; updateHud();
  if (shots === 0) setTimeout(checkShots, 2200);
}
function checkShots(){
  if (over || cleared) return;
  if (shots <= 0){
    over = true;
    hub.finish({ win:false, title:'💫 燃料用尽',
      text:'这一关的发射次数用完了，还没聚变出' + ELS[LEVELS[level].goal].n + '。诀窍：让同种元素落到一起，别让不同元素隔开它们。',
      stat:'第 ' + (level+1) + ' 关 · 剩余发射 0' });
  }
}
function step(){
  if (cooldown > 0) cooldown--;
  for (const b of balls){
    b.vy += 0.22; if (b.vy > 12) b.vy = 12;
    b.x += b.vx; b.y += b.vy;
    b.vx *= 0.99;
    if (b.x < ELR(b)){ b.x = ELR(b); b.vx *= -0.5; }
    if (b.x > W - ELR(b)){ b.x = W - ELR(b); b.vx *= -0.5; }
    if (b.y > H - ELR(b)){ b.y = H - ELR(b); b.vy *= -0.25; if (Math.abs(b.vy) < 1) b.vy = 0; }
    if (b.y < ELR(b)) b.y = ELR(b);
  }
  for (let iter = 0; iter < 4; iter++){
    for (let i = 0; i < balls.length; i++){
      for (let j = i+1; j < balls.length; j++){
        const a = balls[i], b = balls[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 0.01;
        const minD = a.tier === b.tier ? ELS[a.tier].r : ELS[a.tier].r + ELS[b.tier].r;
        if (dist < minD){
          const canFuse = a.tier === b.tier && !ELS[a.tier].ash && ELS[a.tier].next !== null
                          && !mergeLock.has(a) && !mergeLock.has(b);
          if (canFuse){
            const nt = ELS[a.tier].next;
            balls.splice(j,1); balls.splice(i,1);
            balls.push({x:(a.x+b.x)/2, y:Math.max(ELS[nt].r, (a.y+b.y)/2 - 2), vx:0, vy:-1, tier:nt});
            score += (nt+1)*(nt+1)*2; updateHud();
            if (a.tier === 4) supernova((a.x+b.x)/2, (a.y+b.y)/2);
            checkGoal(nt);
            return;
          }
          const overlap = minD - dist;
          const nx = dx/dist, ny = dy/dist;
          a.x -= nx*overlap*0.5; a.y -= ny*overlap*0.5;
          b.x += nx*overlap*0.5; b.y += ny*overlap*0.5;
          const rvn = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
          if (rvn < 0){
            const imp = -rvn * 0.55;
            a.vx -= nx*imp*0.5; a.vy -= ny*imp*0.5;
            b.vx += nx*imp*0.5; b.vy += ny*imp*0.5;
          }
        }
      }
    }
  }
}
function ELR(b){ return ELS[b.tier].r; }
function checkGoal(nt){
  if (cleared) return;
  const L = LEVELS[level];
  if (nt !== L.goal) return;
  cleared = true; over = true;
  const ratio = shots / L.shots;
  const stars = ratio >= 0.5 ? '★★★ 神乎其技！' : ratio >= 0.25 ? '★★☆ 干净利落' : '★☆☆ 险胜';
  document.getElementById('stars').textContent = stars;
  if (nt === 5){
    setTimeout(() => hub.finish({ win:true, title:'🌟 超新星爆发！',
      text:'你把氢一路炼到了铁。铁是聚变链的终点——再往下不再放能，核心失去支撑，恒星就炸了。宇宙里的金银铀，都是这么炸出来的。',
      stat:'6 关全通 · 剩余发射 ' + shots + ' · ' + stars }), 1800);
  } else {
    setTimeout(() => {
      if (level === LEVELS.length - 1){
        hub.finish({ win:true, title:'🌟 炼金塔登顶！', text:'六关全通，元素周期表被你走了一遍。', stat:stars });
      } else {
        restart(level+1);
      }
    }, 1200);
  }
}
function supernova(x, y){
  flash = 1; shake = 20; score += 500; updateHud();
  for (const b of balls){
    const dx = b.x - x, dy = b.y - y, d = Math.sqrt(dx*dx+dy*dy)||1;
    b.vx += dx/d * 12; b.vy += dy/d * 12 - 3;
  }
}
function checkOver(){
  if (cleared) return;
  for (const b of balls){
    if (b.tier === ASH) continue;
    if (b.y - ELS[b.tier].r < DANGER && b.vy >= 0 && cooldown < 10){
      over = true;
      hub.finish({ win:false, title:'💥 恒星坍缩成黑洞',
        text:'原子核堆过了坍缩警戒线，恒星扛不住自身引力了——大质量恒星的结局就是坍缩。',
        stat:'第 ' + (level+1) + ' 关 · 剩余发射 ' + shots });
      return;
    }
  }
}
function draw(){
  ctx.save();
  if (shake > 0){ ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= 0.85; if (shake < 0.5) shake = 0; }
  ctx.clearRect(-30, -30, W+60, H+60);
  ctx.strokeStyle = 'rgba(255,100,100,.45)'; ctx.setLineDash([8,6]);
  ctx.beginPath(); ctx.moveTo(0, DANGER); ctx.lineTo(W, DANGER); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,100,100,.5)'; ctx.font = '11px sans-serif';
  ctx.fillText('⚠ 坍缩警戒线', 8, DANGER - 6);
  if (!over && cooldown <= 0){
    const e = ELS[nextTier];
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.moveTo(aimX||W/2, DANGER); ctx.lineTo(aimX||W/2, H); ctx.stroke();
    ctx.globalAlpha = .5;
    drawAtom(aimX||W/2, DANGER - 40, nextTier);
    ctx.globalAlpha = 1;
  }
  for (const b of balls) drawAtom(b.x, b.y, b.tier);
  if (flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + flash + ')';
    ctx.fillRect(0,0,W,H); flash -= 0.04;
  }
  ctx.restore();
}
function drawAtom(x, y, tier){
  const e = ELS[tier];
  const g = ctx.createRadialGradient(x-4, y-4, 2, x, y, e.r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, e.c); g.addColorStop(1, shade(e.c));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, e.r, 0, 7); ctx.fill();
  ctx.fillStyle = '#0b0e1a'; ctx.font = 'bold ' + Math.max(11, e.r*0.55) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e.s, x, y);
}
function shade(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.floor(((n>>16)&255)*0.4), g = Math.floor(((n>>8)&255)*0.4), b = Math.floor((n&255)*0.4);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function loop(){
  if (!over){ step(); checkOver(); }
  draw();
  requestAnimationFrame(loop);
}
restart(0); loop();
</script>
</body>
</html>
